# Installed as a drop-in for systemd-networkd-wait-online.service by scripts/50-network-dns.sh.
# netplan's generated drop-in waits for EVERY configured NIC, so an unplugged port (the box has an onboard
# one, a USB dongle and Wi-Fi) delayed every boot by two minutes. One working link is enough.
[Service]
ExecStart=
ExecStart=/lib/systemd/systemd-networkd-wait-online --any --timeout=30
