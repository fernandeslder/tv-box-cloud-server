# Cloud stack. Rule of thumb for where bytes live:
#   SSD  (CACHE_ROOT)    databases, thumbnails, transcodes   -> fast, small, regenerable/dumped nightly
#   POOL (STORAGE_ROOT)  originals, files                    -> lands on SSD first, mover drains to the USB HDDs
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:?IMMICH_VERSION missing (docker/.env)}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/London}
      DB_HOSTNAME: immich-db
      DB_USERNAME: immich
      DB_DATABASE_NAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD:?IMMICH_DB_PASSWORD missing (run ./setup.sh)}
      REDIS_HOSTNAME: redis
      IMMICH_MACHINE_LEARNING_URL: ${IMMICH_ML_URL:-http://immich-machine-learning:3003}
    volumes:
      - ${STORAGE_ROOT:-/mnt/pool}/immich:/data
      # Thumbnails + transcodes on the SSD: this is what makes browsing feel instant.
      - ${CACHE_ROOT:-/mnt/cache}/immich-thumbs:/data/thumbs
      - ${CACHE_ROOT:-/mnt/cache}/immich-encoded:/data/encoded-video
      # Sorted Photos/ as a READ-ONLY external library (add /external/photos in Immich > Administration > External Libraries).
      - ${STORAGE_ROOT:-/mnt/pool}/Photos:/external/photos:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      immich-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  immich-machine-learning:
    # CPU fallback on this box. When the Legion is online, point IMMICH_ML_URL at it (docs/10).
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:?IMMICH_VERSION missing (docker/.env)}
    restart: unless-stopped
    mem_limit: 3g
    volumes:
      - immich-model-cache:/cache

  immich-db:
    # Immich's own Postgres build (VectorChord). Do not swap for stock postgres/pgvector.
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD:?IMMICH_DB_PASSWORD missing (run ./setup.sh)}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - ${CACHE_ROOT:-/mnt/cache}/immich-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich -d immich"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: valkey/valkey:9
    restart: unless-stopped
    command: valkey-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextcloud:
    # Pin the MAJOR. Nextcloud cannot skip majors on upgrade: bump one at a time (docs/08).
    image: nextcloud:35-apache
    restart: unless-stopped
    environment:
      MYSQL_HOST: nextcloud-db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?NEXTCLOUD_DB_PASSWORD missing (run ./setup.sh)}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?NEXTCLOUD_ADMIN_PASSWORD missing (run ./setup.sh)}
      NEXTCLOUD_TRUSTED_DOMAINS: files.${DOMAIN:?DOMAIN missing}
      # Behind Caddy: trust the Docker network, speak https, know our public name.
      TRUSTED_PROXIES: 172.16.0.0/12
      OVERWRITEPROTOCOL: https
      OVERWRITEHOST: files.${DOMAIN}
      OVERWRITECLIURL: https://files.${DOMAIN}
      REDIS_HOST: redis
      PHP_MEMORY_LIMIT: 1G
      PHP_UPLOAD_LIMIT: 16G
      APACHE_BODY_LIMIT: "0"
    volumes:
      - ${STORAGE_ROOT:-/mnt/pool}/nextcloud-data:/var/www/html/data
      - ./data/nextcloud:/var/www/html
      # Sorted trees are exposed inside Nextcloud via External Storage (scripts/post-install.sh).
      - ${STORAGE_ROOT:-/mnt/pool}/Photos:/external/Photos
      - ${STORAGE_ROOT:-/mnt/pool}/Documents:/external/Documents
      - ${STORAGE_ROOT:-/mnt/pool}/Music:/external/Music
      - ${STORAGE_ROOT:-/mnt/pool}/Videos:/external/Videos
      - ${STORAGE_ROOT:-/mnt/pool}/Recordings:/external/Recordings
      - ${STORAGE_ROOT:-/mnt/pool}/Other:/external/Other
      - ${STORAGE_ROOT:-/mnt/pool}/private:/external/private
      - ${STORAGE_ROOT:-/mnt/pool}/inbox:/external/Uploads
    depends_on:
      nextcloud-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Nextcloud needs a 5-minute background job; the official image ships a cron entrypoint.
  nextcloud-cron:
    image: nextcloud:35-apache
    restart: unless-stopped
    entrypoint: /cron.sh
    volumes:
      - ${STORAGE_ROOT:-/mnt/pool}/nextcloud-data:/var/www/html/data
      - ./data/nextcloud:/var/www/html
    depends_on:
      - nextcloud

  # Opt-in (profile "docs"): OCR + full-text search over scans and PDFs. Paperless MOVES what it
  # consumes into its own library, so it gets its own drop folder (Samba share "Paperless") rather
  # than the sorted Documents/ tree. The database stays on the SSD; originals live on the pool.
  paperless:
    profiles: ["docs"]
    image: ghcr.io/paperless-ngx/paperless-ngx:3.3.0
    restart: unless-stopped
    environment:
      PAPERLESS_REDIS: redis://redis:6379/3
      PAPERLESS_URL: https://docs.${DOMAIN:?DOMAIN missing}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:-}
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-admin}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:-}
      PAPERLESS_TIME_ZONE: ${TZ:-UTC}
      PAPERLESS_OCR_LANGUAGE: eng
      # The consume folder sits on mergerfs, where inotify is unreliable: poll instead.
      PAPERLESS_CONSUMER_POLLING: "30"
      PAPERLESS_CONSUMER_RECURSIVE: "true"
      USERMAP_UID: ${PUID:-1000}
      USERMAP_GID: ${PGID:-1000}
    volumes:
      - ${CACHE_ROOT:-/mnt/cache}/paperless-data:/usr/src/paperless/data
      - ${STORAGE_ROOT:-/mnt/pool}/paperless/media:/usr/src/paperless/media
      - ${STORAGE_ROOT:-/mnt/pool}/paperless/consume:/usr/src/paperless/consume
      - ${STORAGE_ROOT:-/mnt/pool}/paperless/export:/usr/src/paperless/export
    depends_on:
      redis:
        condition: service_healthy
    labels:
      - com.centurylinklabs.watchtower.enable=false

  nextcloud-db:
    image: mariadb:11.8
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - ${CACHE_ROOT:-/mnt/cache}/nextcloud-db:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: ${NEXTCLOUD_DB_ROOT_PASSWORD:?NEXTCLOUD_DB_ROOT_PASSWORD missing (run ./setup.sh)}
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?NEXTCLOUD_DB_PASSWORD missing (run ./setup.sh)}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  immich-model-cache:
