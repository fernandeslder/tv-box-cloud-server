services:
  immich-server:
    # Pinned to the same version as the laptop's remote ML (see ../ml-laptop).
    # IMMICH_VERSION is a version number (e.g. v2.4.1), NOT :release — both
    # ends stay in lockstep and updates are deliberate (docs/08).
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:?set IMMICH_VERSION in docker/.env (e.g. v2.4.1)}
    restart: unless-stopped
    ports:
      - "2283:2283"
    volumes:
      - ${STORAGE_ROOT:-/mnt/pool}/immich:/data
      - ${CACHE_ROOT:-/mnt/cache}/immich-thumbs:/usr/src/app/upload/thumbs
      - ./immich-library:/usr/src/app/upload/library
    env_file:
      - .env.immich
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  immich-machine-learning:
    # CPU fallback on tvbox. Prefer remote CUDA on laptop (see ../ml-laptop).
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:?set IMMICH_VERSION in docker/.env (e.g. v2.4.1)}
    restart: unless-stopped
    volumes:
      - immich-model-cache:/cache

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # Localhost-only: nothing outside this host needs raw DB access.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ${CACHE_ROOT:-/mnt/cache}/immich-pg:/var/lib/postgresql
      - ./init-user-db.sh:/docker-entrypoint-initdb.d/init-user-db.sh:ro
    env_file:
      - .env.immich
    environment:
      # The base postgres image reads these to create the DB at first boot.
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD:?set IMMICH_DB_PASSWORD in docker/.env}
      POSTGRES_DB: ${IMMICH_DB_NAME:-immich}
      POSTGRES_USER: ${IMMICH_DB_USER:-immich}
    healthcheck:
      # pg_isready -U needs POSTGRES_USER (default "postgres" would fail auth
      # health reporting once we run as the immich user).
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-immich}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ${CACHE_ROOT:-/mnt/cache}/immich-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextcloud:
    image: nextcloud:stable-apache
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ${STORAGE_ROOT:-/mnt/pool}/files:/var/www/html/data
      - ./data/nextcloud:/var/www/html/config
    environment:
      MYSQL_HOST: nextcloud-db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?set NEXTCLOUD_DB_PASSWORD in docker/.env}
    depends_on:
      nextcloud-db:
        condition: service_healthy

  nextcloud-db:
    image: mariadb:11
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - ${CACHE_ROOT:-/mnt/cache}/nextcloud-db:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?set NEXTCLOUD_DB_PASSWORD in docker/.env}
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?set NEXTCLOUD_DB_PASSWORD in docker/.env}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  immich-model-cache:
