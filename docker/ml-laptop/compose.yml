# RUNS ON THE LEGION 7 (RTX 4080 12GB), NOT on tvbox. Connected via Tailscale.
# Setup walkthrough: docs/10-legion-ai-server.md
# GPU rule: one workload family at a time. Ollama side self-swaps
# (OLLAMA_MAX_LOADED_MODELS=1 + KEEP_ALIVE); stop the photos profile
# before huge doc-caption runs and restart after.
# Version lockstep: IMMICH_VERSION is read from the TV box's docker/.env
# (same variable). Set it here too (or export it) — server + remote ML
# versions MUST match or Immich refuses the ML connection.
services:
  immich-machine-learning:
    profiles: ["photos"]
    # ${IMMICH_VERSION}-cuda tracks the TV box variable: v2.4.1 -> v2.4.1-cuda,
    # release -> release-cuda. Both aliases are published upstream.
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-cuda
    ports:
      - "3003:3003"
    volumes:
      - model-cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Only needed if the Legion runs Linux. On stock Windows 11, use the
  # native Ollama app instead (same models, same env vars) and skip this.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:cuda
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_MAX_LOADED_MODELS: 1
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # then: ollama pull qwen2.5:3b-instruct  (Jev, System 1 decision engine)
    #       ollama pull moondream            (screenshot/vision OCR assist)
    #       ollama pull llava:7b             (optional captions)

  # Speech-to-text for speech-vs-music split + recording transcripts.
  # OpenAI-compatible POST :9000/v1/audio/transcriptions. ~2GB VRAM (small),
  # same one-workload-at-a-time GPU rule as everything else on this box.
  whisper:
    profiles: ["audio"]
    # NOTE: the image is onerahmet/... (not ahmetoner/... — that repo 404s).
    # -gpu variant matches the nvidia reservation below.
    image: onerahmet/openai-whisper-asr-webservice:v1.10.0-gpu
    ports:
      - "9000:9000"
    environment:
      ASR_MODEL: small
      ASR_ENGINE: faster_whisper
    volumes:
      - whisper-cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  model-cache:
  ollama:
  whisper-cache:
