services:
  unbound:
    image: mvance/unbound:latest
    restart: unless-stopped
    volumes:
      - ./data/unbound:/opt/unbound/etc/unbound:ro
    labels:
      - com.centurylinklabs.watchtower.enable=false

  pihole:
    image: pihole/pihole:latest
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/London}
      FTLCONF_webserver_api_password: ${PIHOLE_PASS:?set PIHOLE_PASS in .env}
      FTLCONF_dns_upstreams: unbound#5335
      FTLCONF_dns_listeningMode: ALL
      FTLCONF_webserver_port: 8080o,[::]:8080o
      FTLCONF_misc_etc_dnsmasq_d: "true"
    volumes:
      - ./data/pihole:/etc/pihole
    depends_on:
      - unbound
    labels:
      - com.centurylinklabs.watchtower.enable=false

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy-data:/data
      - ./data/caddy-config:/config
    labels:
      - com.centurylinklabs.watchtower.enable=true

  dockge:
    image: louislam/dockge:1
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/dockge:/app/data
      - /opt/stacks:/opt/stacks
    environment:
      TZ: ${TZ:-Europe/London}
    labels:
      - com.centurylinklabs.watchtower.enable=true

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data/homepage:/app/config
    labels:
      - com.centurylinklabs.watchtower.enable=true

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./data/uptime-kuma:/app/data
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    command: --schedule "0 0 4 * * *" --label-enable --cleanup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
