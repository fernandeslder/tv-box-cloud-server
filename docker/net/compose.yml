services:
  unbound:
    # Our own recursive config (./unbound.conf: DNSSEC, no third-party resolver).
    image: mvance/unbound:1.22.0
    restart: unless-stopped
    volumes:
      - ./unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro
    healthcheck:
      # Image default probes :53; we listen on :5335.
      test: ["CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/5335' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    labels:
      - com.centurylinklabs.watchtower.enable=false

  pihole:
    # Pinned date tag, update deliberately (docs/08). Web UI is NOT published: Caddy proxies it.
    image: pihole/pihole:2026.09.0
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    environment:
      TZ: ${TZ:-Europe/London}
      FTLCONF_webserver_api_password: ${PIHOLE_PASS:?run ./setup.sh (it generates docker/.env)}
      FTLCONF_dns_upstreams: unbound#5335
      FTLCONF_dns_listeningMode: ALL
      FTLCONF_webserver_port: "8080"
      # Split-horizon: every name under our domain answers with the box's LAN IP,
      # at home and (via Tailscale subnet routing) away from home.
      FTLCONF_misc_dnsmasq_lines: "address=/${DOMAIN:?DOMAIN missing}/${LAN_IP:?LAN_IP missing}"
    volumes:
      - ./data/pihole:/etc/pihole
    depends_on:
      unbound:
        condition: service_healthy
    labels:
      - com.centurylinklabs.watchtower.enable=false

  caddy:
    build: ./caddy
    image: tvbox/caddy-cloudflare:2.11
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN missing}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy-tls.caddy:/etc/caddy/tls.caddy:ro
      - ./data/caddy-data:/data
      - ./data/caddy-config:/config
      - ./data/setup:/srv/setup:ro
    depends_on:
      - pihole
    labels:
      - com.centurylinklabs.watchtower.enable=false

  # Public access without port-forwarding (works with a dynamic IP): outbound tunnel to Cloudflare.
  # Only started when the wizard enabled it (COMPOSE_PROFILES contains "public").
  cloudflared:
    profiles: ["public"]
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?CF_TUNNEL_TOKEN missing (run scripts/cloudflare.sh)}
    depends_on:
      - caddy

  homepage:
    image: ghcr.io/gethomepage/homepage:v1.5.0
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: home.${DOMAIN},${DOMAIN}
      HOMEPAGE_VAR_DOMAIN: ${DOMAIN}
    volumes:
      - ./homepage:/app/config
    labels:
      - com.centurylinklabs.watchtower.enable=true

  uptime-kuma:
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    volumes:
      - ./data/uptime-kuma:/app/data
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Metrics hub at metrics.<domain>. Pair once (Add System -> copy KEY/TOKEN into .env),
  # then: docker compose --profile agent up -d
  beszel:
    image: henrygd/beszel:0.21
    restart: unless-stopped
    volumes:
      - ./data/beszel:/beszel_data
      - ./data/beszel-socket:/beszel_socket
    environment:
      TZ: ${TZ:-Europe/London}
    labels:
      - com.centurylinklabs.watchtower.enable=true

  beszel-agent:
    profiles: ["agent"]
    image: henrygd/beszel-agent:0.21
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/beszel-agent:/var/lib/beszel-agent
      - ./data/beszel-socket:/beszel_socket
      - ${CACHE_ROOT:-/mnt/cache}:/extra-filesystems/ssd:ro
      - /mnt/hdd:/extra-filesystems/hdd:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      KEY: ${BESZEL_KEY:-}
      TOKEN: ${BESZEL_TOKEN:-}

  # Only updates the few low-risk UIs labelled enable=true. Never DNS, Caddy, databases or Immich.
  watchtower:
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    command: --schedule "0 0 4 * * *" --label-enable --cleanup --rolling-restart
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
