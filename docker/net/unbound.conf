# Unbound recursive resolver for the TV box (shipped, no third-party DNS).
# Pi-hole upstreams to us at unbound#5335 (see docker/net/compose.yml).
# Mounted read-only. The image entrypoint (/unbound.sh) skips generating its
# default config when this file exists, but still runs unbound-anchor, so the
# DNSSEC root key lands at var/root.key inside the chroot — hence the
# chroot + relative trust-anchor path below. Do NOT add
# a-records/srv-records/forward-records includes: those files are the image's
# Cloudflare-DoT defaults and must stay out of a recursive setup.
server:
  interface: 0.0.0.0@5335
  port: 5335
  directory: "/opt/unbound/etc/unbound"
  chroot: "/opt/unbound/etc/unbound"
  username: "_unbound"
  do-daemonize: no

  access-control: 127.0.0.0/8 allow
  access-control: 10.0.0.0/8 allow
  access-control: 172.16.0.0/12 allow
  access-control: 192.168.0.0/16 allow
  access-control: 100.64.0.0/10 allow

  do-ip4: yes
  do-ip6: yes
  do-udp: yes
  do-tcp: yes
  # Prefer IPv4 upstream: many home routers advertise broken IPv6, and this
  # only affects transport preference, not the answers we serve.
  prefer-ip6: no

  # Hardened recursive defaults (adapted from the image's own example config).
  hide-identity: yes
  hide-version: yes
  harden-glue: yes
  harden-dnssec-stripped: yes
  harden-large-queries: yes
  harden-short-bufsize: yes
  harden-below-nxdomain: yes
  deny-any: yes
  qname-minimisation: yes
  aggressive-nsec: yes
  val-clean-additional: yes
  # 0x20 randomisation is known to cause DNSSEC validation issues; keep off.
  use-caps-for-id: no
  # Rebinding protection: never return LAN addresses for public names.
  # (*.home.lan is answered by Pi-hole itself, never reaches us — unaffected.)
  private-address: 10.0.0.0/8
  private-address: 172.16.0.0/12
  private-address: 192.168.0.0/16
  private-address: 169.254.0.0/16
  private-address: fd00::/8
  private-address: fe80::/10
  private-address: ::ffff:0:0/96
  ratelimit: 1000

  # Generated at container start by the image entrypoint (unbound-anchor).
  auto-trust-anchor-file: "var/root.key"

  edns-buffer-size: 1232
  prefetch: yes
  prefetch-key: yes
  serve-expired: yes
  num-threads: 2
  msg-cache-size: 32m
  rrset-cache-size: 64m
  num-queries-per-thread: 1024
  outgoing-range: 2048

  # Log to stderr (→ docker logs) at operational level. Quieter than the
  # image default of /dev/null, louder than silence: you want to see
  # DNSSEC failures when debugging the phones.
  verbosity: 1
  log-queries: no
  log-replies: no
  log-servfail: yes

remote-control:
  control-enable: no
