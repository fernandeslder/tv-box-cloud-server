# Opt-in: enable by uncommenting in docker/compose.yml
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    ports:
      - "8096:8096"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${STORAGE_ROOT:-/mnt/pool}/media:/media:ro
      - ./data/jellyfin-config:/config
      - ${CACHE_ROOT:-/mnt/cache}/jellyfin-transcode:/transcodes

  gluetun:
    image: qmcgaw/gluetun:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8085:8080"   # qbit WebUI via gluetun netns
      - "6881:6881"
      - "6881:6881/udp"
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_PROVIDER:-protonvpn}
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WG_PRIVATE_KEY:?set for torrent stack}
      FIREWALL_VPN_INPUT_ALLOW: 192.168.0.0/24,100.64.0.0/10
    labels:
      - com.centurylinklabs.watchtower.enable=false

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    network_mode: service:gluetun
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/London}
      WEBUI_PORT: 8080
    volumes:
      - ./data/qbit:/config
      - ${STORAGE_ROOT:-/mnt/pool}/media/downloads:/downloads
    depends_on:
      - gluetun
    labels:
      - com.centurylinklabs.watchtower.enable=false
