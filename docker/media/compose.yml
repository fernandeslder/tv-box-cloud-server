# Opt-in: enable by uncommenting in docker/compose.yml
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    ports:
      - "8096:8096"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${STORAGE_ROOT:-/mnt/pool}/media:/media:ro
      - ./data/jellyfin-config:/config
      - ${CACHE_ROOT:-/mnt/cache}/jellyfin-transcode:/transcodes

  gluetun:
    image: qmcgaw/gluetun:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8085:8080"   # qbit WebUI via gluetun netns
      - "6881:6881"
      - "6881:6881/udp"
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_PROVIDER:-protonvpn}
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WG_PRIVATE_KEY:?set for torrent stack}
      FIREWALL_VPN_INPUT_ALLOW: 192.168.0.0/24,100.64.0.0/10
    labels:
      - com.centurylinklabs.watchtower.enable=false

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    network_mode: service:gluetun
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/London}
      WEBUI_PORT: 8080
    volumes:
      - ./data/qbit:/config
      - ${STORAGE_ROOT:-/mnt/pool}/media/downloads:/downloads
    depends_on:
      - gluetun
    labels:
      - com.centurylinklabs.watchtower.enable=false

  # Self-hosted Spotify: Navidrome (Subsonic API, ~50MB RAM). Phone apps:
  # Symfonium / Tempo / substreamer. Library = pool Music/ (read-only).
  navidrome:
    image: deluan/navidrome:latest
    restart: unless-stopped
    ports:
      - "4533:4533"
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_SCANINTERVAL: 1h
      ND_LOGLEVEL: info
    volumes:
      - ${STORAGE_ROOT:-/mnt/pool}/Music:/music:ro
      - ./data/navidrome:/data

  # Audiobooks + podcasts: Audiobookshelf (~100MB RAM). Own phone app.
  # Point a library at pool Other/audiobooks (or Music/audiobooks).
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    restart: unless-stopped
    ports:
      - "13378:80"
    volumes:
      - ${STORAGE_ROOT:-/mnt/pool}/Other/audiobooks:/audiobooks
      - ${STORAGE_ROOT:-/mnt/pool}/Other/podcasts:/podcasts
      - ./data/audiobookshelf-config:/config
      - ./data/audiobookshelf-metadata:/metadata
