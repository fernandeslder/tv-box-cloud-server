# Opt-in services, enabled with compose profiles (COMPOSE_PROFILES in docker/.env):
#   media    -> jellyfin, navidrome, audiobookshelf
#   torrent  -> gluetun (VPN kill-switch) + qbittorrent (needs WG_PRIVATE_KEY)
# Nothing here publishes a host port: Caddy reaches everything over the Docker network.
services:
  jellyfin:
    profiles: ["media"]
    image: jellyfin/jellyfin:10
    restart: unless-stopped
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-105}"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${STORAGE_ROOT:-/mnt/pool}/Videos:/media/Videos:ro
      - ${STORAGE_ROOT:-/mnt/pool}/media:/media/library:ro
      - ./data/jellyfin-config:/config
      - ${CACHE_ROOT:-/mnt/cache}/jellyfin-transcode:/transcodes
    environment:
      JELLYFIN_PublishedServerUrl: https://tv.${DOMAIN}
    labels:
      - com.centurylinklabs.watchtower.enable=false

  navidrome:
    profiles: ["media"]
    image: deluan/navidrome:latest
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_BASEURL: ""
    volumes:
      - ${STORAGE_ROOT:-/mnt/pool}/Music:/music:ro
      - ./data/navidrome:/data
    labels:
      - com.centurylinklabs.watchtower.enable=true

  audiobookshelf:
    profiles: ["media"]
    image: ghcr.io/advplyr/audiobookshelf:latest
    restart: unless-stopped
    volumes:
      - ${STORAGE_ROOT:-/mnt/pool}/media/audiobooks:/audiobooks
      - ${STORAGE_ROOT:-/mnt/pool}/media/podcasts:/podcasts
      - ./data/audiobookshelf-config:/config
      - ./data/audiobookshelf-metadata:/metadata
    labels:
      - com.centurylinklabs.watchtower.enable=true

  gluetun:
    profiles: ["torrent"]
    image: qmcgaw/gluetun:v3.41
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_PROVIDER:-protonvpn}
      VPN_TYPE: wireguard
      # Required for the "torrent" profile (the wizard asks for it).
      WIREGUARD_PRIVATE_KEY: ${WG_PRIVATE_KEY:-}
      # LAN + Tailscale ranges reachable from behind the tunnel (Caddy lives in the Docker net).
      FIREWALL_OUTBOUND_SUBNETS: ${GLUETUN_SUBNETS:-${LAN_CIDR:-192.168.0.0/24},100.64.0.0/10,172.16.0.0/12}
      DOT: "off"
      BLOCK_MALICIOUS: "on"
    labels:
      - com.centurylinklabs.watchtower.enable=false

  qbittorrent:
    profiles: ["torrent"]
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    # Everything (incl. the web UI) runs inside gluetun's network namespace = kill-switch.
    network_mode: service:gluetun
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/London}
      WEBUI_PORT: 8080
    volumes:
      - ./data/qbit:/config
      - ${STORAGE_ROOT:-/mnt/pool}/media/downloads:/downloads
    depends_on:
      gluetun:
        condition: service_healthy
    labels:
      - com.centurylinklabs.watchtower.enable=false
