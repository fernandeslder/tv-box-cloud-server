name: ci
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh
      - run: python3 -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('docker/**/compose.yml',recursive=True)]; print('compose yaml ok')"
